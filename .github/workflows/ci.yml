name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall rebuilds better-sqlite3 against Electron's ABI - needs a C/C++ toolchain
      # (preinstalled on ubuntu-latest) but no display, Electron itself isn't launched
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
